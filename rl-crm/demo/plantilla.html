<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RL Industrial · Sitio + CRM (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0E1216;font-family:"Archivo",system-ui,sans-serif}
.barra{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;border-bottom:1px solid #2E3740}
.barra b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#8CC63F;margin-right:6px;white-space:nowrap}
.barra button{border:0;border-radius:99px;padding:9px 14px;font:700 14px inherit;font-family:inherit;cursor:pointer;background:#222A32;color:#C9D0D6;white-space:nowrap}
.barra button.on{background:#8CC63F;color:#0E1216}
.barra .nota{margin-left:auto;font-size:12.5px;color:#9AA3AB;max-width:520px;line-height:1.3}
#reiniciar{background:none;box-shadow:inset 0 0 0 1.5px #2E3740}
iframe{display:block;width:100%;height:calc(100% - 56px);border:0;background:#F4F3EF}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#8CC63F;color:#0E1216;font-weight:700;padding:12px 18px;border-radius:14px;z-index:9;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (max-width:760px){.barra .nota{display:none}.barra b{display:none}}
</style></head><body>
<div class="barra"><b>Demo</b><button data-modo="sitio" class="on">Página pública</button><button data-modo="panel">Panel de Rosy</button><button id="reiniciar">Reiniciar</button>
<span class="nota">Todo funciona aquí: agrega bodegas, sube fotos, llena el formulario y mira cómo llega al panel. Contraseña del panel: <b style="color:#fff;letter-spacing:0;text-transform:none">rosy2026</b>. Las fotos de muestra se ven en el sitio publicado.</span></div>
<iframe id="vista" title="Vista de la demo"></iframe>
<script>/*APP*/</script>
</body></html>
