`;var da=`:root{

.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.estrecho{width:min(860px,100% - 40px)}
.muted{color:var(--gris)}.muted-claro{color:var(--gris-claro)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:0 20px;border-radius:999px;border:0;font-weight:700;font-size:15.5px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s,box-shadow .15s}

:focus-visible{outline:3px solid var(--lima);outline-offset:2px}

/* ================= Animaci\xF3n ================= */
@keyframes kenburns{from{transform:scale(1.12) translate3d(0,0,0)}to{transform:scale(1) translate3d(-1.5%,-1%,0)}}
@keyframes subePal{from{transform:translateY(105%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
@keyframes aparecer{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes linea{from{width:0}to{width:34px}}
@keyframes cinta{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@keyframes flecha{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes brillo{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes cae{from{opacity:0;transform:translate(-50%,-160%)}to{opacity:1;transform:translate(-50%,-100%)}}

.hero-fotos img.on{animation:kenburns 18s ease-out both}

.titular{display:block}

.titular .verde{color:var(--lima)}
.hero .eyebrow{animation:aparecer .7s .05s both}
.hero .eyebrow span{animation:linea .8s .1s both}
.hero-sub{animation:aparecer .8s .55s both}
.buscador{animation:aparecer .8s .7s both}

.hero-ficha svg{animation:flecha 1.6s 2s ease-in-out infinite}

.top.scroll .top-in{height:62px}

/* Cinta */
.cinta{background:var(--lima);color:var(--tinta);overflow:hidden;white-space:nowrap;border-block:1px solid #7AB234}
.cinta-in{display:inline-flex;animation:cinta 32s linear infinite}

.cinta i::after{content:"";width:8px;height:8px;background:var(--tinta);transform:rotate(45deg)}
.cinta:hover .cinta-in{animation-play-state:paused}

/* Botones con brillo */
.btn-lima{position:relative;overflow:hidden}
.btn-lima::after{content:"";position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%) skewX(-20deg)}
.btn-lima:hover::after{animation:brillo .8s ease}
.btn-lima:hover svg,.btn-linea:hover svg{animation:flecha .8s ease-in-out infinite}
.wa-flota{animation:pulso 2.4s 3s infinite}
.wa-flota:hover{transform:scale(1.08)}
.wa-flota{transition:transform .2s}

/* Revelados al hacer scroll */
.aparece{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.aparece.si{opacity:1;transform:none}
.titulo-sec h2{overflow:hidden}
.titulo-sec.aparece .eyebrow span{width:0;transition:width .8s .2s}
.titulo-sec.aparece.si .eyebrow span{width:34px}
.card .card-foto::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 55%,rgba(14,18,22,.45));opacity:0;transition:opacity .3s}
.card:hover .card-foto::before{opacity:1}
.card .chip-op,.card .chip-estado,.card .chip-fotos{z-index:2}
.card-precio b{transition:color .2s}
.card:hover .card-precio b{color:var(--lima-osc)}
.pasos li{transition:transform .25s,box-shadow .25s}
.pasos li:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(14,18,22,.06),0 18px 40px -16px rgba(14,18,22,.3)}
.pasos li::after{content:"";position:absolute;left:26px;right:26px;bottom:0;height:3px;background:var(--lima);transform:scaleX(1);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1) calc(var(--d,0s) + .3s)}
.pasos li.aparece::after{transform:scaleX(0)}
.pasos li.aparece.si::after{transform:scaleX(1)}
.card.inclina{transition:transform .12s ease-out,box-shadow .2s;transition-delay:0s}
.zona{transition:border-color .2s,transform .2s}
.zona:hover{transform:translateY(-2px)}
.pin-precio{animation:cae .5s cubic-bezier(.2,.8,.2,1.4) both;animation-delay:var(--d,0s)}
.mosaico button{animation:aparecer .7s both}
.mosaico button:nth-child(2){animation-delay:.08s}.mosaico button:nth-child(3){animation-delay:.16s}.mosaico button:nth-child(4){animation-delay:.24s}.mosaico button:nth-child(5){animation-delay:.32s}
.ficha h1{animation:aparecer .7s both}
.ficha-lado .caja{animation:aparecer .8s .2s both}
.rapidas a{transition:transform .15s,border-color .15s,background .15s,color .15s}
.rapidas a:hover{transform:translateY(-2px)}
.faq details[open] p{animation:aparecer .35s both}
.carac li{transition:transform .2s}
.carac li:hover{transform:translateX(4px)}

  .aparece{opacity:1;transform:none}
}
