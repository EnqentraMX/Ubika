<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1216">
<title>Panel · RL Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--tinta:#0E1216;--acero:#171D23;--papel:#F4F3EF;--blanco:#fff;--linea:#E2E0DA;--lima:#8CC63F;--lima-osc:#4F7A1A;--lima-suave:#EEF6E2;--ambar:#E8A317;--ambar-suave:#FDF3DC;--rojo:#C8442F;--rojo-suave:#FBE9E6;--azul:#2F6FD6;--azul-suave:#E8F0FC;--gris:#5F666D;--wa:#1FAF55;--f:"Archivo",system-ui,sans-serif;--m:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
svg{width:20px;height:20px;flex:none}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.1}
a{color:inherit}

/* Botones */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:12px;font-weight:700;font-size:15.5px;cursor:pointer;text-decoration:none;background:var(--blanco);box-shadow:inset 0 0 0 1.5px var(--linea);white-space:nowrap}
.b:active{transform:scale(.97)}
.b.lima{background:var(--lima);box-shadow:none;color:var(--tinta)}
.b.negro{background:var(--tinta);color:#fff;box-shadow:none}
.b.wa{background:var(--wa);color:#fff;box-shadow:none}
.b.rojo{color:var(--rojo);box-shadow:inset 0 0 0 1.5px #F1C9C1}
.b.chico{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.b.icono{width:46px;padding:0}
.b.chico.icono{width:38px}
.b:disabled{opacity:.55;cursor:default}

/* Entrar */
.entrar{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--tinta)}
.entrar form{width:min(400px,100%);background:var(--blanco);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px}
.entrar img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.entrar h1{font-size:26px;font-weight:900;text-transform:uppercase;font-variation-settings:"wdth" 115}
.entrar p{margin:0;color:var(--gris)}

/* Estructura */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.lado{background:var(--tinta);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.lado .marca{display:flex;gap:10px;align-items:center;padding:0 8px 18px;border-bottom:1px solid #263039;margin-bottom:10px}
.lado .marca img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#fff}
.lado .marca b{display:block;font-size:14px;text-transform:uppercase;font-variation-settings:"wdth" 115}
.lado .marca small{font-size:12px;color:#9AA3AB}
.tab{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;border:0;background:none;color:#C9D0D6;font-weight:600;font-size:15.5px;cursor:pointer;text-align:left;width:100%;position:relative}
.tab:hover{background:#1A2128;color:#fff}
.tab.on{background:var(--lima);color:var(--tinta)}
.tab .n{margin-left:auto;background:var(--rojo);color:#fff;font:700 12px var(--m);padding:2px 7px;border-radius:99px}
.tab.on .n{background:var(--tinta)}
.lado .abajo{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{padding:28px clamp(16px,3vw,40px) 120px;max-width:1200px;width:100%;min-width:0}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.cab h1{font-size:clamp(26px,4vw,36px);font-weight:900;text-transform:uppercase;font-variation-settings:"wdth" 115}
.cab p{margin:4px 0 0;color:var(--gris)}
.abajo-movil{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lado{display:none}
  .abajo-movil{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0;z-index:40;background:var(--tinta);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .abajo-movil .tab{flex-direction:column;gap:3px;font-size:11.5px;padding:8px 2px;justify-content:center;text-align:center}
  .abajo-movil .tab .n{position:absolute;top:2px;right:12%;margin:0;font-size:10px;padding:1px 5px}
  main{padding:18px 14px 110px}
}

/* Tarjetas resumen */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--blanco);border-radius:18px;padding:18px;border:0;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.kpi b{display:block;font:700 34px var(--m);letter-spacing:-.03em}
.kpi span{color:var(--gris);font-size:14px;font-weight:600}
.kpi.verde b{color:var(--lima-osc)}.kpi.rojo b{color:var(--rojo)}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}}
.panel{background:var(--blanco);border-radius:18px;padding:20px;margin-bottom:18px}
.panel h2{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);margin-bottom:14px;font-weight:800}
.atajos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.dos-col{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:960px){.dos-col{grid-template-columns:1fr}}
.vacio{color:var(--gris);padding:18px 0;text-align:center}

/* Listas */
.buscar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.buscar input{flex:1;min-width:200px;height:46px;border:1.5px solid var(--linea);border-radius:12px;padding:0 14px;background:var(--blanco);font-size:16px}
.filas{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;gap:14px;align-items:center;background:var(--blanco);border-radius:16px;padding:12px;cursor:pointer;border:1.5px solid transparent}
.fila:hover{border-color:var(--linea)}
.fila .mini{width:92px;height:72px;border-radius:12px;object-fit:cover;background:#D8D6CF;flex:none}
.fila .mini.vacia{display:grid;place-items:center;color:var(--gris);font-size:12px;font-weight:700}
.fila .info{flex:1;min-width:0}
.fila .info b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:17px;overflow:hidden;line-height:1.2}
.fila .info span{display:block;color:var(--gris);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .der{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.precio{font:700 15px var(--m)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-disponible,.p-ganado{background:var(--lima-suave);color:var(--lima-osc)}
.p-apartada,.p-visita,.p-negociacion{background:var(--ambar-suave);color:#8A5A00}
.p-rentada,.p-perdido{background:var(--rojo-suave);color:var(--rojo)}
.p-oculta{background:#ECEBE7;color:var(--gris)}
.p-nuevo{background:var(--azul-suave);color:var(--azul)}
.p-contactado{background:#EFE9FB;color:#6B45C2}
.fila .info .estrella{display:inline;color:var(--ambar);font-size:15px}
.clics{font:600 12px var(--m);color:var(--gris)}
@media (max-width:560px){.fila .mini{width:70px;height:60px}.fila .der .precio{display:none}}

/* Embudo */
.embudo{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.embudo button{flex:none;border:1.5px solid var(--linea);background:var(--blanco);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.embudo button i{font:700 13px var(--m);font-style:normal;color:var(--gris)}
.embudo button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.embudo button.on i{color:var(--lima)}
.lead .acciones{display:flex;gap:6px}

/* Hoja (editor) */
.hoja{position:fixed;inset:0;z-index:80;background:rgba(14,18,22,.45);display:flex;justify-content:flex-end}
.hoja-in{background:var(--papel);width:min(760px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;animation:entra .22s ease}
@keyframes entra{from{transform:translateX(40px);opacity:.5}to{transform:none;opacity:1}}
.hoja-cab{position:sticky;top:0;z-index:5;background:var(--tinta);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.hoja-cab h2{font-size:18px;text-transform:uppercase;font-variation-settings:"wdth" 112;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoja-cab .b{background:#222A32;color:#fff;box-shadow:none}
.hoja-cuerpo{padding:18px;display:flex;flex-direction:column;gap:16px;flex:1}
.hoja-pie{position:sticky;bottom:0;background:var(--blanco);border-top:1px solid var(--linea);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.hoja-pie .b.lima{flex:1;min-height:54px;font-size:17px}
.sin-guardar{font-size:13px;color:#8A5A00;font-weight:700}
.bloque{background:var(--blanco);border-radius:18px;padding:18px}
.bloque>h3{display:flex;align-items:center;gap:10px;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);font-weight:800;margin-bottom:14px}
.bloque>h3 i{font:700 13px var(--m);font-style:normal;background:var(--lima-suave);color:var(--lima-osc);width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.ayuda{font-size:13.5px;color:var(--gris);margin:-6px 0 12px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos .todo{grid-column:1/-1}
@media (max-width:560px){.campos{grid-template-columns:1fr}}
label.c{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
label.c small{font-weight:500;color:var(--gris);margin-top:-4px}
.in,label.c input,label.c select,label.c textarea{width:100%;border:1.5px solid var(--linea);border-radius:12px;padding:12px 13px;font-size:16px;background:#FCFCFA;font-weight:500;outline:0}
label.c input:focus,label.c select:focus,label.c textarea:focus,.in:focus{border-color:var(--lima-osc);box-shadow:0 0 0 3px var(--lima-suave);background:#fff}
textarea{resize:vertical}
.pesos{position:relative}.pesos input{padding-left:26px}.pesos::before{content:"$";position:absolute;left:13px;bottom:13px;font-weight:700;color:var(--gris)}
.seg{display:flex;background:#ECEBE6;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:10px 8px;border-radius:9px;font-weight:700;font-size:14.5px;cursor:pointer;min-width:max-content;color:var(--gris)}
.seg button.on{background:var(--blanco);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.estado button.on[data-v=disponible]{background:var(--lima);color:var(--tinta)}
.seg.estado button.on[data-v=apartada]{background:var(--ambar)}
.seg.estado button.on[data-v=rentada]{background:var(--rojo);color:#fff}
.seg-et{font-weight:700;font-size:14px;margin-bottom:6px;display:block}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;background:#FCFCFA}
.sw small{display:block;font-weight:500;color:var(--gris);font-size:13px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:46px;height:28px;border-radius:99px;background:#C3C7CB;position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--lima)}
.sw input:checked+i::after{transform:translateX(18px)}

/* Fotos */
.fotos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:620px){.fotos{grid-template-columns:repeat(3,1fr)}}
.foto{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#DDD}
.foto img{width:100%;height:100%;object-fit:cover}
.foto .portada{position:absolute;left:6px;top:6px;background:var(--lima);color:var(--tinta);font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.foto .ctl{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.foto .ctl button{width:32px;height:32px;border-radius:9px;border:0;background:rgba(255,255,255,.92);font-weight:800;cursor:pointer;display:grid;place-items:center;font-size:15px}
.foto .ctl button.x{background:var(--rojo);color:#fff}
.foto.subiendo::after{content:"Subiendo…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.75);font-weight:700;font-size:13px}
.agregar{aspect-ratio:1;border-radius:14px;border:2px dashed #BFC4B5;background:var(--lima-suave);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--lima-osc);text-align:center;padding:6px}
.agregar svg{width:30px;height:30px}
.agregar.arrastre{background:#DDEFC6;border-color:var(--lima-osc)}
.cuenta-fotos{font:700 13px var(--m);color:var(--gris)}
/* Chips de características */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:var(--lima-suave);border-radius:99px;padding:6px 6px 6px 12px;font-weight:600;font-size:14px}
.chips button{width:24px;height:24px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-weight:800;line-height:1}
.agrega-fila{display:flex;gap:8px}
.agrega-fila input{flex:1}
.sugeridas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sugeridas button{border:1.5px dashed var(--linea);background:none;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gris)}
.sugeridas button:hover{border-color:var(--lima-osc);color:var(--lima-osc)}
.coord-ok{font:600 13px var(--m);color:var(--lima-osc)}
.peligro{border:1.5px solid #F1C9C1;background:#FFF9F8}

/* Notas */
.notas{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.nota{background:#F7F6F2;border-radius:12px;padding:10px 12px;font-size:15px}
.nota time{display:block;font:600 12px var(--m);color:var(--gris);margin-bottom:2px}
.contacto-r{display:flex;gap:8px;flex-wrap:wrap}

/* Avisos */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:200;background:var(--tinta);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;animation:sube .2s}
.toast.mal{background:var(--rojo)}
@keyframes sube{from{transform:translate(-50%,10px);opacity:0}}
.modal{position:fixed;inset:0;z-index:150;background:rgba(14,18,22,.5);display:grid;place-items:center;padding:20px}
.modal div{background:#fff;border-radius:20px;padding:24px;width:min(420px,100%)}
.modal h3{font-size:20px;margin-bottom:8px}
.modal p{color:var(--gris);margin:0 0 18px}
.modal .acc{display:flex;gap:10px;justify-content:flex-end}
.carga{min-height:60vh;display:grid;place-items:center;color:var(--gris)}
.agenda h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);margin:18px 0 10px}
.agenda h3.venc{color:var(--rojo)}
.fecha{font:700 13px var(--m);background:var(--azul-suave);color:var(--azul);padding:4px 8px;border-radius:8px}
.fecha.venc{background:var(--rojo-suave);color:var(--rojo)}
.fecha.hoy{background:var(--lima);color:var(--tinta)}
.faq-ed{display:flex;flex-direction:column;gap:12px}
.faq-ed .item{border:1.5px solid var(--linea);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.foto-conf{display:flex;gap:14px;align-items:center}
.foto-conf img{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#ddd}
</style>
</head>

    img.onload=function(){var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
      cv.toBlob(function(b){if(b&&b.type==="image/webp")res(b);else cv.toBlob(function(j){j?res(j):rej(new Error("No se pudo leer la foto"))},"image/jpeg",.84)},"image/webp",.82)};

  $("#addNota",h).onclick=addNota;$("#nNota",h).addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addNota()}});

  function cerrar(){if(sucio){confirma("¿Salir sin guardar?","Perderás los cambios de este prospecto.","Salir sin guardar").then(function(si){if(si){h.remove();document.body.style.overflow=""}})}else{h.remove();document.body.style.overflow=""}}
  $("[data-cerrar]",h).onclick=cerrar;h.addEventListener("click",function(e){if(e.target===h)cerrar()});
  var borrar=$("[data-borrar]",h);
  if(borrar)borrar.onclick=function(){confirma("¿Eliminar a "+l.nombre+"?","Se borra con todas sus notas.","Eliminar").then(function(si){if(!si)return;api("DELETE","/api/admin/lead/"+l.id).then(function(){D.leads=D.leads.filter(function(x){return x.id!==l.id});h.remove();document.body.style.overflow="";aviso("Prospecto eliminado");pinta()}).catch(function(e){aviso(e.message,true)})})};
  $("[data-guardar]",h).onclick=function(){
    var nn=$("#nNota",h);if(nn.value.trim())addNota();
    if(!f.nombre.value.trim()){f.nombre.focus();aviso("Escribe el nombre.",true);return}
    var datos={etapa:l.etapa,notas:l.notas};["nombre","telefono","empresa","correo","m2","zona","giro","presupuesto","proxima","bodega"].forEach(function(k){datos[k]=f[k].value});
    if(f.origen)datos.origen=f.origen.value;
    var bt=this;bt.disabled=true;bt.textContent="Guardando…";
    (orig?api("PUT","/api/admin/lead/"+orig.id,datos):api("POST","/api/admin/lead",datos)).then(function(j){
      if(orig)Object.assign(orig,j.lead);else D.leads.unshift(j.lead);
      h.remove();document.body.style.overflow="";aviso("Prospecto guardado");pinta()}).catch(function(e){aviso(e.message,true);bt.disabled=false;bt.textContent="Guardar"});
  };
  if(!orig)setTimeout(function(){f.nombre.focus()},50);
}

/* ---------- Agenda ---------- */
function vAgenda(){
  var v=$("#vista"),hoy=hoyISO();
  var sem=new Date();sem.setDate(sem.getDate()+7);var semISO=sem.toISOString().slice(0,10);
  var act=D.leads.filter(function(l){return l.proxima&&l.etapa!=="ganado"&&l.etapa!=="perdido"}).sort(function(a,b){return a.proxima<b.proxima?-1:1});
  var g=[["Vencidos","venc",act.filter(function(l){return l.proxima<hoy})],["Hoy","",act.filter(function(l){return l.proxima===hoy})],["Próximos 7 días","",act.filter(function(l){return l.proxima>hoy&&l.proxima<=semISO})],["Más adelante","",act.filter(function(l){return l.proxima>semISO})]];
  v.innerHTML='<div class="cab"><div><h1>Agenda</h1><p>Visitas y seguimientos. Pon fecha en cada prospecto para que aparezca aquí.</p></div></div><div class="agenda">'+
  (act.length?g.filter(function(x){return x[2].length}).map(function(x){return'<h3 class="'+x[1]+'">'+x[0]+' · '+x[2].length+'</h3><div class="filas">'+x[2].map(filaLead).join("")+'</div>'}).join(""):'<p class="vacio">No tienes seguimientos agendados. Abre un prospecto y ponle “Próximo seguimiento o visita”.</p>')+'</div>';
  enlazar(v);
}

/* ---------- Ajustes ---------- */
function vAjustes(){
  var v=$("#vista"),c=JSON.parse(JSON.stringify(D.config));
  var faq=(c.faq&&c.faq.length?c.faq:FAQ_BASE).map(function(x){return x.slice()});
  function campo(k,t,ph,tipo){return'<label class="c">'+t+'<input name="'+k+'" '+(tipo?'type="'+tipo+'" ':"")+'value="'+esc(c[k]||"")+'" placeholder="'+esc(ph||"")+'"></label>'}
  v.innerHTML='<div class="cab"><div><h1>Ajustes</h1><p>Datos que aparecen en tu página.</p></div></div><form id="fC" class="hoja-cuerpo" style="padding:0">'+
  '<section class="bloque"><h3>Tu negocio</h3><div class="campos">'+campo("nombre","Nombre del negocio")+campo("asesora","Quién atiende","Lic. Rosy Luna")+campo("telefono","Teléfono que se muestra","55 6201 6449","tel")+campo("whatsapp","WhatsApp (10 dígitos)","5562016449","tel")+campo("correo","Correo","","email")+campo("horario","Horario","Lunes a sábado, 9:00 a 19:00")+'<label class="c todo">Dirección de oficina<input name="oficina" value="'+esc(c.oficina||"")+'"></label></div></section>'+
  '<section class="bloque"><h3>Imágenes</h3><div class="campos"><div class="foto-conf"><img id="imLogo" src="'+esc(c.logo||"")+'" alt=""><div><b>Logo</b><br><button type="button" class="b chico" data-img="logo">Cambiar logo</button></div></div><div class="foto-conf"><img id="imAse" src="'+esc(c.fotoAsesora||"")+'" alt=""><div><b>Tu foto</b><br><button type="button" class="b chico" data-img="fotoAsesora">Cambiar foto</button></div></div></div></section>'+
  '<section class="bloque"><h3>Portada de la página</h3><div class="campos">'+campo("frase","Frase pequeña de arriba")+'<label class="c todo">Título grande<input name="titular" value="'+esc(c.titular||"")+'" maxlength="70"></label><label class="c todo">Texto debajo del título<textarea name="subtitular" rows="3" maxlength="400">'+esc(c.subtitular||"")+'</textarea></label></div></section>'+
  '<section class="bloque"><h3>Preguntas frecuentes</h3><div class="faq-ed" id="faq"></div><button type="button" class="b chico" id="addFaq" style="margin-top:12px">'+I.mas+'Agregar pregunta</button></section>'+
  '<button type="button" class="b lima" id="guardarC" style="min-height:54px">Guardar ajustes</button>'+
  '<section class="bloque"><h3>Contraseña</h3><div class="campos"><label class="c">Contraseña actual<input type="password" id="pA" autocomplete="current-password"></label><label class="c">Nueva contraseña<input type="password" id="pN" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label></div><button type="button" class="b" id="cambiaP" style="margin-top:12px">Cambiar contraseña</button></section>'+
  '<section class="bloque"><h3>Acceso a este panel</h3><p style="margin:0">Este panel no aparece en tu página. Guarda esta dirección en tus favoritos:</p><p style="font:600 15px var(--m);background:#F3F2EE;padding:10px 12px;border-radius:10px;word-break:break-all;margin:10px 0">'+(demo?"(la dirección secreta del panel)":esc(location.origin+location.pathname))+'</p><button type="button" class="b chico" data-salir2>'+I.salir+'Cerrar sesión</button></section></form>';
  var f=$("#fC");
  function pintaFaq(){$("#faq").innerHTML=faq.map(function(x,i){return'<div class="item"><input class="in" data-fq="'+i+'" value="'+esc(x[0])+'" placeholder="Pregunta"><textarea class="in" data-fa="'+i+'" rows="3" placeholder="Respuesta">'+esc(x[1])+'</textarea><button type="button" class="b chico rojo" data-fx="'+i+'" style="align-self:flex-start">Quitar</button></div>'}).join("")}
  pintaFaq();
  $("#faq").addEventListener("input",function(e){var t=e.target;if(t.dataset.fq!=null)faq[+t.dataset.fq][0]=t.value;if(t.dataset.fa!=null)faq[+t.dataset.fa][1]=t.value});
  $("#faq").addEventListener("click",function(e){var x=e.target.closest("[data-fx]");if(x){faq.splice(+x.dataset.fx,1);pintaFaq()}});
  $("#addFaq").onclick=function(){faq.push(["",""]);pintaFaq();var q=$$("#faq [data-fq]");q[q.length-1].focus()};
  $$("[data-img]",v).forEach(function(bt){bt.onclick=function(){var a=$("#archivo");a.value="";a.removeAttribute("multiple");a.onchange=function(){a.setAttribute("multiple","");var file=a.files[0];if(!file)return;bt.disabled=true;
    comprimir(file).then(function(bl){return api("POST","/api/admin/foto",bl,bl.type)}).then(function(j){c[bt.dataset.img]=j.url;(bt.dataset.img==="logo"?$("#imLogo"):$("#imAse")).src=j.url;aviso("Imagen lista. Toca “Guardar ajustes”.")}).catch(function(e){aviso(e.message,true)}).then(function(){bt.disabled=false})};a.click()}});
  $("#guardarC").onclick=function(){var d={faq:faq.filter(function(x){return x[0].trim()&&x[1].trim()}),logo:c.logo,fotoAsesora:c.fotoAsesora};["nombre","asesora","telefono","whatsapp","correo","horario","oficina","frase","titular","subtitular"].forEach(function(k){d[k]=f[k].value});
    if(String(d.whatsapp).replace(/\D/g,"").length<10){aviso("El WhatsApp debe tener 10 dígitos.",true);return}
    var bt=this;bt.disabled=true;api("PUT","/api/admin/config",d).then(function(j){D.config=j.config;aviso("Ajustes guardados");pinta()}).catch(function(e){aviso(e.message,true);bt.disabled=false})};
  $("#cambiaP").onclick=function(){api("POST","/api/admin/password",{actual:$("#pA").value,nueva:$("#pN").value}).then(function(){$("#pA").value=$("#pN").value="";aviso("Contraseña cambiada")}).catch(function(e){aviso(e.message,true)})};
  $("[data-salir2]",v).onclick=salir;
}

addEventListener("beforeunload",function(e){if($(".hoja #sg:not([hidden])")){e.preventDefault();e.returnValue=""}});
cargar();
})();
</script>
